services:
  postgres:
    image: postgres:17.9-alpine
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - boilerplate-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  adminer:
    image: adminer
    restart: always
    ports:
      - 8888:8080

  # Uncomment to use redis
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - 6379:6379

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # ★ Skill Plaza: 把同级 .env 注入容器，让 SKILL_SERVICE_TOKEN
    #   等 NestJS-side 密钥真正生效（image build 阶段 baked-in 的
    #   env-example-relational 没有这些 key，光靠它会让 guard 走
    #   代码默认值 'dev-skill-service-token'，production VibeTrading
    #   侧对不上 → 401 → list_user_skills fail-soft 到 [] →
    #   system prompt 没有 Plaza skill → "skill not loaded"）。
    #   重新 `docker compose up -d` 后 env_file 生效，restart API 后
    #   NestJS 进程读到正确 token。
    env_file:
      - .env
    ports:
      - ${APP_PORT}:${APP_PORT}

volumes:
  boilerplate-db:
